openapi: 3.0.0
info:
  title: RCI (Roys Counsel Indonesia) API
  description: API Documentation for RCI Mobile & Web Applications. All endpoints except AI Chat require a Sanctum Bearer token.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Current API Version
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /chat/send:
    post:
      summary: AI Legal Chat (Freemium)
      description: |
        Send a legal question to the AI assistant. 
        - **Guest/Free users**: Limited to 3 questions/day, receives general analysis.
        - **Pro users (corporate/lawyer)**: Unlimited access, receives detailed analysis with specific UU/Pasal references.
        Uses OpenRouter API with fallback to built-in responses.
      tags:
        - AI Chat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: Legal question (max 2000 characters)
                  example: "Saya ingin menanyakan tentang hak pesangon setelah di-PHK"
                session_id:
                  type: string
                  description: Session ID for guest users (auto-generated if not provided)
                user_id:
                  type: integer
                  description: User ID for testing (optional, overridden by Sanctum auth)
      responses:
        '200':
          description: AI Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  tier:
                    type: string
                    enum: [guest, free, pro]
                  data:
                    type: object
                    properties:
                      answer:
                        type: string
                      topic:
                        type: string
                        enum: [pidana, perdata, keluarga, bisnis, properti, tenaga_kerja, umum]
                      confidence:
                        type: number
                      disclaimer:
                        type: string
                  usage:
                    type: object
                    properties:
                      limit:
                        type: integer
                      used:
                        type: integer
                      remaining:
                        type: integer
        '429':
          description: Daily limit reached (Free/Guest users)
  /rci/chat:
    post:
      summary: AI Chat for Authenticated Users
      description: AI legal chat for verified, authenticated users via Sanctum token.
      tags:
        - AI Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: "Bagaimana cara mengajukan gugatan perdata?"
      responses:
        '200':
          description: AI Response
        '401':
          description: Unauthenticated
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [client, paralegal, lawyer, corporate]
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Authenticate a user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    type: object
  /auth/forgot-password:
    post:
      summary: Send password reset link to user email
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: client@rci-app.id
      responses:
        '200':
          description: Password reset link sent successfully
        '400':
          description: Validation error or email not found
  /auth/reset-password:
    post:
      summary: Reset user password using the token sent to email
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                  description: The token from the password reset email
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid token or validation error
  /auth/me:
    get:
      summary: Get authenticated user profile
      tags:
        - Authentication
      responses:
        '200':
          description: OK
  /cases:
    get:
      summary: Get a list of legal cases (Client)
      tags:
        - Case Management
      responses:
        '200':
          description: OK
    post:
      summary: Submit a new legal case (Client)
      tags:
        - Case Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - category
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
      responses:
        '201':
          description: Created
  /cases/{case_id}/documents:
    post:
      summary: Upload a document to a case
      tags:
        - Case Management
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                document_type:
                  type: string
                  enum: [evidence, legal_letter, contract, identification, other]
      responses:
        '201':
          description: Document Uploaded
  /cases/{case_id}/messages:
    get:
      summary: Get chat messages for a case
      tags:
        - Chat
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    post:
      summary: Send a chat message
      tags:
        - Chat
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                attachments:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Message Sent
  /paralegal/cases:
    get:
      summary: Kanban Board Cases (Paralegal)
      tags:
        - Paralegal Dashboard
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [need_action, reviewing]
      responses:
        '200':
          description: OK
    post:
      summary: Register a new COD case (Paralegal)
      description: |
        Create a new legal case on behalf of a non-tech-savvy client (COD).
        Generates a shadow client account (if not already existing) and funds the escrow from the paralegal's wallet.
        Requires `auth:sanctum` + `verified` + `role:paralegal`.
      tags:
        - Paralegal Dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_name
                - client_phone
                - title
                - description
                - category
                - amount
              properties:
                client_name:
                  type: string
                  example: "Pak Budi Desa"
                client_phone:
                  type: string
                  example: "08123456789"
                title:
                  type: string
                  example: "Sengketa Batas Tanah Sawah"
                description:
                  type: string
                  example: "Terjadi sengketa batas tanah sawah dengan tetangga sebelah."
                category:
                  type: string
                  example: "hukum perdata"
                amount:
                  type: number
                  example: 200000
      responses:
        '201':
          description: COD Case created and active
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: Unauthenticated
        '422':
          description: Validation error or insufficient balance
  /paralegal/cases/{id}/status:
    post:
      summary: Move a case in Kanban (Paralegal)
      tags:
        - Paralegal Dashboard
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [in_progress, reviewing, escalated, completed]
      responses:
        '200':
          description: Status Updated
  /paralegal/marketplace:
    get:
      summary: Job Marketplace Feed (Paralegal)
      tags:
        - Job Marketplace
      responses:
        '200':
          description: OK
  /paralegal/marketplace/{case_id}/apply:
    post:
      summary: Apply for an open case (Paralegal)
      tags:
        - Job Marketplace
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assigned
  /lawyer/cases/{case_id}/quote:
    post:
      summary: Send Quotation to Client (Lawyer)
      tags:
        - Lawyer Dashboard
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposed_fee
              properties:
                proposed_fee:
                  type: number
                fee_notes:
                  type: string
      responses:
        '200':
          description: Quoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object

  # ────────────────────────────────────────────────
  # Payment & Wallet
  # ────────────────────────────────────────────────
  /rci/topup:
    post:
      summary: Top-Up Wallet (Client)
      description: |
        Add funds to the authenticated client's wallet.
        Requires `auth:sanctum` + `verified` + `role:client`.
        The amount is credited instantly to the wallet balance.
      tags:
        - Payment & Wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  minimum: 1
                  description: Amount in IDR to top-up
                  example: 100000
      responses:
        '200':
          description: Wallet topped up successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Wallet topped up successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      wallet_id:
                        type: integer
                      amount:
                        type: string
                        example: "100000.00"
                      type:
                        type: string
                        example: deposit
                      status:
                        type: string
                        example: success
                      description:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: Unauthenticated
        '422':
          description: Validation error or invalid amount

  /rci/upgrade:
    post:
      summary: Upgrade to Pro Membership (Client)
      description: |
        Upgrade the authenticated client to Pro/Corporate membership.
        Deducts Rp 50.000 from wallet balance.
        Requires `auth:sanctum` + `verified` + `role:client`.
      tags:
        - Payment & Wallet
      responses:
        '200':
          description: Membership upgraded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Membership upgraded to Pro successfully.
                  data:
                    type: object
                    nullable: true
        '401':
          description: Unauthenticated
        '422':
          description: Insufficient balance or already Pro

  /rci/escrow/start:
    post:
      summary: Lock Funds in Escrow (Client)
      description: |
        Lock funds from the client's wallet into escrow for a legal case.
        The case status changes to `active` after funds are locked.
        Funds remain in escrow until the case is completed, then released:
        - **90%** to the assigned expert (paralegal/lawyer)
        - **10%** platform fee to admin
        Requires `auth:sanctum` + `verified` + `role:client`.
      tags:
        - Payment & Wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - case_id
                - amount
              properties:
                case_id:
                  type: integer
                  description: ID of the legal case to fund
                  example: 1
                amount:
                  type: number
                  minimum: 1
                  description: Amount in IDR to lock in escrow
                  example: 500000
      responses:
        '200':
          description: Funds locked in escrow
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Funds locked in escrow successfully.
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      wallet_id:
                        type: integer
                      amount:
                        type: string
                        example: "500000.00"
                      type:
                        type: string
                        example: escrow_hold
                      status:
                        type: string
                        example: pending
                      reference_type:
                        type: string
                        example: App\Models\LegalCase
                      reference_id:
                        type: integer
                      description:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: Unauthenticated
        '422':
          description: Insufficient balance, invalid case, or validation error

  # ────────────────────────────────────────────────
  # Auth — Missing endpoints
  # ────────────────────────────────────────────────
  /auth/logout:
    post:
      summary: Logout (Revoke token)
      description: Revoke the current Sanctum access token.
      tags:
        - Authentication
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Logged out successfully.
        '401':
          description: Unauthenticated

  # ────────────────────────────────────────────────
  # Email Verification
  # ────────────────────────────────────────────────
  /email/verify/{id}/{hash}:
    get:
      summary: Verify Email Address
      description: Verify a user's email using the signed URL sent via email.
      tags:
        - Email Verification
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '403':
          description: Invalid or expired signature

  /email/resend:
    post:
      summary: Resend Verification Email
      description: Resend the email verification link.
      tags:
        - Email Verification
      security: []
      responses:
        '200':
          description: Verification email sent

  # ────────────────────────────────────────────────
  # Paralegal Dashboard — Missing stats
  # ────────────────────────────────────────────────
  /paralegal/dashboard/stats:
    get:
      summary: Dashboard Statistics (Paralegal)
      description: |
        Get summary statistics for the Paralegal dashboard header.
        Returns counts of new cases, active cases, completed cases, and earnings.
      tags:
        - Paralegal Dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      new_cases_count:
                        type: integer
                      active_cases_count:
                        type: integer
                      completed_count:
                        type: integer
                      total_earnings:
                        type: string
        '401':
          description: Unauthenticated

  # ────────────────────────────────────────────────
  # Lawyer Dashboard — Missing stats & revenue
  # ────────────────────────────────────────────────
  /lawyer/dashboard/stats:
    get:
      summary: Dashboard Statistics (Lawyer)
      description: |
        Get summary statistics for the Lawyer (The Specialist) dashboard header.
        Returns new referrals, active cases, completed count, and rating.
      tags:
        - Lawyer Dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      new_referrals_count:
                        type: integer
                      active_cases_count:
                        type: integer
                      completed_count:
                        type: integer
                      rating:
                        type: number
                        format: float
        '401':
          description: Unauthenticated

  /lawyer/revenue:
    get:
      summary: Professional Revenue Info (Lawyer)
      description: Get professional revenue data and completed case count.
      tags:
        - Lawyer Dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      completed_cases:
                        type: integer
        '401':
          description: Unauthenticated

  # ────────────────────────────────────────────────
  # Chat — Missing mark-as-read
  # ────────────────────────────────────────────────
  /cases/{case_id}/messages/read:
    put:
      summary: Mark Messages as Read (Client)
      description: Mark all unread messages in a case chat as read.
      tags:
        - Chat
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Messages marked as read
        '401':
          description: Unauthenticated

  /cases/{id}:
    get:
      summary: Get Case Detail (Client)
      description: Get detailed information about a specific legal case.
      tags:
        - Case Management
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          description: Unauthenticated
        '404':
          description: Case not found
